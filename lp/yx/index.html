<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>油香邮箱系统-修复marked错误版</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#fff;font-family:system-ui;max-width:850px;margin:30px auto;padding:20px}
        h1{text-align:center;color:#111;margin-bottom:20px}
        .my-mail{text-align:center;color:#2563eb;font-size:1.1rem;margin-bottom:25px}
        .card{border:1px solid #eee;border-radius:8px;padding:24px;margin-bottom:20px}
        .inp-group{margin-bottom:16px}
        label{display:block;margin-bottom:6px;font-weight:500}
        input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:1rem}
        textarea{min-height:150px;resize:vertical}
        textarea.small{min-height:70px}
        button{padding:10px 22px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-size:1rem;cursor:pointer}
        button.danger{background:#dc2626;float:right}
        .tabs{display:flex;gap:10px;margin-bottom:20px;border-bottom:1px solid #eee;padding-bottom:10px}
        .tab{background:#f3f4f6;border:none;padding:8px 16px;border-radius:6px;cursor:pointer}
        .tab.active{background:#2563eb;color:#fff}
        .mail-item{padding:14px;border-bottom:1px solid #f3f4f6;user-select:none;position:relative;z-index:999;min-height:70px}
        .mail-item:hover{background:#eff6ff}
        .mail-header{display:flex;justify-content:space-between;margin-bottom:6px;font-weight:500}
        .mail-time{color:#6b7280;font-size:0.9rem}
        .mail-preview{color:#4b5563;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
        .mail-detail{margin-top:16px;padding:16px;border:2px solid #2563eb;border-radius:6px}
        .md-content { line-height: 1.8; margin: 12px 0; }
        .md-content strong { font-weight: 600; }
        .md-content em { font-style: italic; }
        .attachments{margin-top:16px;padding-top:16px;border-top:1px solid #eee}
        .atc-item{padding:6px 10px;margin:4px 0;background:#f3f4f6;border-radius:4px}
        .tip{padding:10px;border-radius:6px;margin-top:15px}
        .tip.ok{background:#dcfce7;color:#166534}
        .tip.err{background:#fee2e2;color:#991b1b}
        .hidden{display:none !important}
    </style>
</head>
<body>
    <h1>油香邮箱系统</h1>

    <!-- 登录界面 -->
    <div id="loginPage">
        <div class="card">
            <h3 style="margin-bottom:20px">账号登录</h3>
            <div class="inp-group">
                <label>用户名</label>
                <input type="text" id="loginU">
            </div>
            <div class="inp-group">
                <label>密码</label>
                <input type="password" id="loginP">
            </div>
            <button onclick="doLogin()">确认登录</button>
            <div class="tip" id="loginTip"></div>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="mainPage" class="hidden">
        <div class="my-mail" id="showMyMail"></div>
        <button class="btn danger" onclick="logout()">退出登录</button>
        <div class="tabs">
            <button class="tab active" onclick="switchTab('inbox')">收件箱</button>
            <button class="tab" onclick="switchTab('sent')">已发送</button>
            <button class="tab" onclick="switchTab('send')">写邮件</button>
        </div>

        <!-- 收件箱 -->
        <div id="inboxTab">
            <div class="card">
                <h3 style="margin-bottom:15px">收到的邮件</h3>
                <div id="inboxList"></div>
                <div class="mail-detail hidden" id="inDetail"></div>
            </div>
        </div>

        <!-- 已发送 -->
        <div id="sentTab" class="hidden">
            <div class="card">
                <h3 style="margin-bottom:15px">已发送邮件</h3>
                <div id="sentList"></div>
                <div class="mail-detail hidden" id="outDetail"></div>
            </div>
        </div>

        <!-- 写邮件 -->
        <div id="sendTab" class="hidden">
            <div class="card">
                <h3 style="margin-bottom:15px">发送新邮件</h3>
                <div class="inp-group">
                    <label>接收方用户名</label>
                    <input type="text" id="toUser">
                </div>
                <div class="inp-group">
                    <label>邮件内容</label>
                    <textarea id="mailBody"></textarea>
                </div>
                <div class="inp-group">
                    <label>附件链接（多个换行分隔）</label>
                    <textarea id="atc" class="small"></textarea>
                </div>
                <button onclick="sendMail()">发送邮件</button>
                <div class="tip" id="sendTip"></div>
            </div>
        </div>
    </div>

    <!-- 先加载Supabase，再加载Markdown，顺序绝对不能错 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1/dist/umd/supabase.min.js"></script>
    <script>
        // 先定义安全的markdown渲染降级函数，就算marked没加载也不会报错
        function safeMdRender(content) {
            // 如果marked库加载成功就用它渲染
            if(window.marked) return marked.parse(content);
            // 降级方案：手动替换基础Markdown语法，完全不依赖外部库
            return content
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/\n/g, '<br>');
        }
    </script>
    <!-- 最后加载Markdown库，不会出现未定义错误 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/lib/marked.min.js"></script>

    <script>
        // 全局变量全部顶级声明，没有作用域问题
        const sb = supabase.createClient(
            "https://aonoebeajppbziyzucsm.supabase.co",
            "sb_publishable_AKUMJeqzjC-LPEng6iWR_A_hMg2GT_J"
        );
        let currentUser = null;
        // 全局邮件池，所有邮件存在这里，点击直接取索引
        let inboxMails = [], sentMails = [];

        // 登录函数 全局可直接调用，完全不需要绑定
        async function doLogin() {
            const u = document.getElementById('loginU').value.trim();
            const p = btoa(unescape(encodeURIComponent(document.getElementById('loginP').value)));
            const tip = document.getElementById('loginTip');

            if(!u || !p) {
                tip.className = 'tip err';
                tip.innerText = "用户名密码不能为空";
                return;
            }

            tip.innerText = "正在验证登录...";
            tip.className = 'tip';

            const { data } = await sb.from('lt_users').select('*').eq('username', u).eq('password', p);
            if(data.length > 0) {
                currentUser = data[0];
                localStorage.setItem('u', JSON.stringify(currentUser));
                tip.className = 'tip ok';
                tip.innerText = "登录成功";
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('mainPage').classList.remove('hidden');
                document.getElementById('showMyMail').innerText = `${currentUser.username}@kxy_1`;
                // 加载收件箱
                loadInbox();
            } else {
                tip.className = 'tip err';
                tip.innerText = "账号密码错误";
            }
        }

        // 加载收件箱
        async function loadInbox() {
            const listDom = document.getElementById('inboxList');
            const { data } = await sb.from('lt_email').select('*').eq('username', currentUser.username).order('time',false);
            inboxMails = data || [];
            listDom.innerHTML = '';
            if(inboxMails.length === 0) {
                listDom.innerHTML = '<p style="color:#666">暂无邮件</p>';
                return;
            }
            // 直接内联onclick事件，绑定全局openInMail函数，100%绝对可触发
            for(let i=0;i<inboxMails.length;i++) {
                const mail = inboxMails[i];
                const preview = mail.message.replace(/[#*`]/g, '').slice(0,50);
                const item = document.createElement('div');
                item.className = 'mail-item';
                item.innerHTML = `
                    <div class="mail-header">来自 ${mail.sender}@kxy_1 <span class="mail-time">${new Date(mail.time).toLocaleString()}</span></div>
                    <div class="mail-preview">${preview}...</div>
                    <button style="margin-top:8px;padding:6px 12px;font-size:0.9rem" onclick="openInMail(${i})">查看详情</button>
                `;
                listDom.appendChild(item);
            }
        }

        // 全局收件箱邮件打开函数，全局作用域直接可调用
        window.openInMail = function(index) {
            const mail = inboxMails[index];
            const detail = document.getElementById('inDetail');
            detail.innerHTML = `
                <h4>发件人：${mail.sender}@kxy_1</h4>
                <p style="color:#6b7280;">发送时间：${new Date(mail.time).toLocaleString()}</p>
                <div class="md-content">${safeMdRender(mail.message)}</div>
            `;
            detail.classList.remove('hidden');
        }

        // 加载已发送
        async function loadSent() {
            const listDom = document.getElementById('sentList');
            const { data } = await sb.from('lt_email').select('*').eq('sender', currentUser.username).order('time',false);
            sentMails = data || [];
            listDom.innerHTML = '';
            if(sentMails.length === 0) {
                listDom.innerHTML = '<p style="color:#666">暂无邮件</p>';
                return;
            }
            for(let i=0;i<sentMails.length;i++) {
                const mail = sentMails[i];
                const preview = mail.message.replace(/[#*`]/g, '').slice(0,50);
                const item = document.createElement('div');
                item.className = 'mail-item';
                item.innerHTML = `
                    <div class="mail-header">发送给 ${mail.username}@kxy_1 <span class="mail-time">${new Date(mail.time).toLocaleString()}</span></div>
                    <div class="mail-preview">${preview}...</div>
                    <button style="margin-top:8px;padding:6px 12px;font-size:0.9rem" onclick="openSentMail(${i})">查看详情</button>
                `;
                listDom.appendChild(item);
            }
        }

        // 全局已发送邮件打开函数
        window.openSentMail = function(index) {
            const mail = sentMails[index];
            const detail = document.getElementById('outDetail');
            detail.innerHTML = `
                <h4>接收方：${mail.username}@kxy_1</h4>
                <p style="color:#6b7280;">发送时间：${new Date(mail.time).toLocaleString()}</p>
                <div class="md-content">${safeMdRender(mail.message)}</div>
            `;
            detail.classList.remove('hidden');
        }

        // 标签切换
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
            document.querySelectorAll('#mainPage>div[id$=Tab]').forEach(d=>d.classList.add('hidden'));
            if(tab === 'inbox') {
                document.querySelector('.tab:nth-child(1)').classList.add('active');
                document.getElementById('inboxTab').classList.remove('hidden');
                loadInbox();
            } else if(tab === 'sent') {
                document.querySelector('.tab:nth-child(2)').classList.add('active');
                document.getElementById('sentTab').classList.remove('hidden');
                loadSent();
            } else if(tab === 'send') {
                document.querySelector('.tab:nth-child(3)').classList.add('active');
                document.getElementById('sendTab').classList.remove('hidden');
            }
        }

        // 发送邮件
        async function sendMail() {
            const to = document.getElementById('toUser').value.trim();
            const content = document.getElementById('mailBody').value.trim();
            const tip = document.getElementById('sendTip');
            if(!to || !content) {
                tip.className = 'tip err';
                tip.innerText = "不能为空";
                return;
            }
            const atcs = document.getElementById('atc').value.split('\n').filter(x=>x.trim());
            await sb.from('lt_email').insert({
                username: to,
                sender: currentUser.username,
                time: new Date().toISOString(),
                message: content,
                attachments: atcs
            });
            tip.className = 'tip ok';
            tip.innerText = "发送成功";
        }

        // 退出登录
        function logout() {
            localStorage.removeItem('u');
            currentUser = null;
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
        }

        // 自动登录
        const saved = localStorage.getItem('u');
        if(saved) {
            currentUser = JSON.parse(saved);
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainPage').classList.remove('hidden');
            document.getElementById('showMyMail').innerText = `${currentUser.username}@kxy_1`;
            loadInbox();
        }
    </script>
</body>
</html>
