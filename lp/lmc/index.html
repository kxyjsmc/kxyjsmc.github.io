<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的世界 全生存修复版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: sans-serif; }
        #gameContainer { width: 100vw; height: 100vh; position: relative; background: #87ceeb; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; pointer-events: none; }
        #ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 100; }
        .inventory-slot { width: 50px; height: 50px; background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.3); border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-size: 10px; cursor: pointer; }
        .inventory-slot .count { font-size: 8px; margin-top: 2px; }
        .inventory-slot.selected { border-color: white; background: rgba(255,255,255,0.2); }
        #fullInventory { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90vw; max-height: 90vh; padding: 20px; background: rgba(0,0,0,0.92); border-radius: 8px; z-index: 200; color: white; display: none; overflow-y: auto; }
        .item-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; margin: 12px 0; }
        .item-slot { width: 50px; height: 50px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 9px; }
        .category-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .category-tab { padding: 5px 10px; background: rgba(255,255,255,0.1); border-radius: 4px; cursor: pointer; }
        .category-tab.active { background: #4CAF50; }
        #statusBar { position: absolute; top: 20px; left: 20px; color: white; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 4px; z-index: 100; font-size: 12px; }
        #chatBox { position: absolute; bottom: 80px; left: 20px; width: 300px; max-height: 120px; background: rgba(0,0,0,0.5); border-radius: 4px; padding: 8px; color: white; overflow-y: auto; z-index: 100; display: none; }
        #winScreen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 1000; display: none; align-items: center; justify-content: center; color: white; text-align: center; }
        /* 熔炉系统样式 */
        .crafting-section, .furnace-section { padding: 12px; background: rgba(255,255,255,0.05); border-radius: 8px; margin: 8px; display: inline-block; }
        .crafting-grid { display: grid; grid-template-columns: repeat(3, 50px); gap: 3px; }
        .crafting-slot, .furnace-slot { width: 50px; height: 50px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 9px; }
        .furnace-grid { display: flex; align-items: center; gap: 10px; }
        .smelt-arrow { font-size: 24px; color: #ff6600; margin: 0 10px; }
        .burn-progress-bar { width: 100px; height: 15px; background: rgba(0,0,0,0.3); border-radius: 4px; overflow: hidden; margin: 4px 0; }
        .burn-progress { height: 100%; background: #ff6600; width: 0%; transition: width 0.1s; }
        .result-slot { width: 70px; height: 70px; background: rgba(76, 175, 80, 0.3); border: 2px solid rgba(255,255,255,0.4); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; }
        .recipe-browser { max-height: 200px; overflow-y: auto; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-top: 8px; }
        .recipe-item { padding: 8px; margin: 4px 0; background: rgba(255,255,255,0.08); border-radius: 4px; font-size: 10px; }
        .recipe-item.can-craft { border-left: 3px solid #4CAF50; }
        .recipe-item.cannot-craft { border-left: 3px solid #f44336; }
        button { padding: 8px 16px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 4px 0; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="crosshair">+</div>
        
        <div id="statusBar">
            <div>❤️ 生命值: <span id="health">20</span>/20</div>
            <div>🍖 饥饿值: <span id="hunger">20</span>/20</div>
            <div>🔥 燃烧时间: <span id="burnTime">0</span>s</div>
        </div>

        <div id="ui">
            <div class="inventory-slot selected" data-slot="0">草方块<div class="count">10</div></div>
            <div class="inventory-slot" data-slot="1">圆石<div class="count">30</div></div>
            <div class="inventory-slot" data-slot="2">橡木<div class="count">15</div></div>
            <div class="inventory-slot" data-slot="3">泥土<div class="count">20</div></div>
            <div class="inventory-slot" data-slot="4">木镐<div class="count">1</div></div>
            <div class="inventory-slot" data-slot="5">木剑<div class="count">1</div></div>
            <div class="inventory-slot" data-slot="6">面包<div class="count">5</div></div>
            <div class="inventory-slot" data-slot="7">速度药水<div class="count">2</div></div>
            <div class="inventory-slot" data-slot="8">火把<div class="count">32</div></div>
        </div>

        <div id="fullInventory">
            <h2>我的世界 生存版</h2>
            <div class="category-tabs">
                <div class="category-tab active" data-category="all">全部物品</div>
                <div class="category-tab" data-category="blocks">方块</div>
                <div class="category-tab" data-category="tools">工具</div>
                <div class="category-tab" data-category="combat">战斗</div>
                <div class="category-tab" data-category="food">食物</div>
                <div class="category-tab" data-category="materials">材料</div>
            </div>
            
            <!-- 合成+熔炉 双系统 -->
            <div style="display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0;">
                <div class="crafting-section">
                    <h3>合成台</h3>
                    <div style="display: flex; align-items: center;">
                        <div class="crafting-grid" id="craftingGrid">
                            <div class="crafting-slot" data-craft-slot="0"></div>
                            <div class="crafting-slot" data-craft-slot="1"></div>
                            <div class="crafting-slot" data-craft-slot="2"></div>
                            <div class="crafting-slot" data-craft-slot="3"></div>
                            <div class="crafting-slot" data-craft-slot="4"></div>
                            <div class="crafting-slot" data-craft-slot="5"></div>
                            <div class="crafting-slot" data-craft-slot="6"></div>
                            <div class="crafting-slot" data-craft-slot="7"></div>
                            <div class="crafting-slot" data-craft-slot="8"></div>
                        </div>
                        <div class="result-slot" id="craftingResult">成品</div>
                    </div>
                </div>

                <div class="furnace-section">
                    <h3>熔炉</h3>
                    <div class="furnace-grid">
                        <div>
                            <div class="crafting-slot" id="furnaceInputSlot">原料</div>
                            <div class="crafting-slot" id="furnaceFuelSlot" style="margin-top: 5px;">燃料</div>
                        </div>
                        <div>
                            <div class="smelt-arrow">↓</div>
                            <div class="burn-progress-bar"><div class="burn-progress" id="burnProgress"></div></div>
                            <div class="progress-label" id="smeltProgressLabel">0%</div>
                        </div>
                        <div class="result-slot" id="furnaceOutputSlot">成品</div>
                    </div>
                </div>
            </div>

            <h3>物品列表</h3>
            <div class="item-grid" id="itemGrid"></div>
            
            <h3>配方列表</h3>
            <div class="recipe-browser" id="recipeList"></div>
            
            <button id="closeInventory">关闭(E)</button>
        </div>

        <div id="chatBox"></div>

        <div id="winScreen">
            <h1>恭喜通关！</h1>
            <button id="restartGame">重新开始</button>
        </div>
    </div>

    <script>
        // -------------------------- 物品数据 --------------------------
        const ITEMS = [
            {id: "grass_block", name: "草方块", category: "blocks", color: 0x5d8c3f, maxStack: 64},
            {id: "dirt", name: "泥土", category: "blocks", color: 0x8b5a2b, maxStack: 64},
            {id: "cobblestone", name: "圆石", category: "blocks", color: 0x808080, maxStack: 64},
            {id: "stone", name: "石头", category: "blocks", color: 0x999999, maxStack: 64},
            {id: "sand", name: "沙子", category: "blocks", color: 0xf7e9a3, maxStack: 64},
            {id: "coal_ore", name: "煤矿石", category: "blocks", color: 0x888888, maxStack: 64},
            {id: "iron_ore", name: "铁矿石", category: "blocks", color: 0x888888, maxStack: 64},
            {id: "oak_log", name: "橡木原木", category: "blocks", color: 0x6d4c41, maxStack: 64},
            {id: "oak_planks", name: "橡木木板", category: "blocks", color: 0xa06539, maxStack: 64},
            {id: "cobblestone", name: "圆石", category: "blocks", color: 0x808080, maxStack: 64},
            {id: "stone_pickaxe", name: "石镐", category: "tools", color: 0x808080, maxStack: 1},
            {id: "wooden_pickaxe", name: "木镐", category: "tools", color: 0xa06539, maxStack: 1},
            {id: "iron_pickaxe", name: "铁镐", category: "tools", color: 0xcacaca, maxStack: 1},
            {id: "stone_sword", name: "石剑", category: "combat", color: 0x808080, maxStack: 1},
            {id: "wooden_sword", name: "木剑", category: "combat", color: 0xa06539, maxStack: 1},
            {id: "bread", name: "面包", category: "food", color: 0xf7e9a3, maxStack: 64},
            {id: "apple", name: "苹果", category: "food", color: 0xcc2828, maxStack: 64},
            {id: "coal", name: "煤炭", category: "materials", color: 0x1a1a1a, maxStack: 64, burnTime: 80},
            {id: "iron_ingot", name: "铁锭", category: "materials", color: 0xcacaca, maxStack: 64},
            {id: "stick", name: "木棍", category: "materials", color: 0xf7e9a3, maxStack: 64},
            {id: "crafting_table", name: "合成台", category: "blocks", color: 0xa06539, maxStack: 64},
            {id: "furnace", name: "熔炉", category: "blocks", color: 0x808080, maxStack: 64},
            {id: "torch", name: "火把", category: "blocks", color: 0xffc845, maxStack: 64},
        ];

        // -------------------------- 配方数据 --------------------------
        const RECIPES = [
            {result: "oak_planks", amount: 4, ingredients: ["oak_log"]},
            {result: "stick", amount: 4, ingredients: ["oak_planks", "oak_planks"], pattern: [null, "oak_planks", null, null, "oak_planks", null]},
            {result: "wooden_pickaxe", amount: 1, ingredients: ["oak_planks", "oak_planks", "oak_planks", "stick", "stick"], pattern: ["oak_planks", "oak_planks", "oak_planks", null, "stick", null, null, "stick", null]},
            {result: "stone_pickaxe", amount: 1, ingredients: ["cobblestone", "cobblestone", "cobblestone", "stick", "stick"], pattern: ["cobblestone", "cobblestone", "cobblestone", null, "stick", null, null, "stick", null]},
            {result: "crafting_table", amount: 1, ingredients: ["oak_planks", "oak_planks", "oak_planks", "oak_planks"]},
            {result: "furnace", amount: 1, ingredients: Array(8).fill("cobblestone")},
        ];

        const SMELTING_RECIPES = [
            {input: "iron_ore", output: "iron_ingot", experience: 0.7},
            {input: "coal_ore", output: "coal", experience: 0.1},
            {input: "oak_log", output: "charcoal", experience: 0.15},
        ];

        // -------------------------- 全局状态 --------------------------
        let inventory = {};
        ITEMS.forEach(item => inventory[item.id] = 0);
        inventory.grass_block = 10;
        inventory.cobblestone = 30;
        inventory.iron_ore = 8;
        inventory.coal = 20;
        inventory.oak_log = 15;
        inventory.wooden_pickaxe = 1;
        inventory.wooden_sword = 1;
        inventory.bread = 5;
        inventory.stick = 12;
        inventory.furnace = 1;
        inventory.apple = 5;

        let craftingGrid = Array(9).fill(null);
        let furnace = {
            inputItem: null,
            fuelItem: null,
            outputItem: null,
            burnTimeLeft: 0,
            maxBurnTime: 0,
            smeltProgress: 0,
            maxSmeltTime: 100
        };

        let health = 20;
        let hunger = 20;
        let activePotions = [];
        let selectedSlot = 0;
        let isPointerLocked = false;
        let currentCategory = "all";
        let gameRunning = true;

        // -------------------------- 核心UI渲染函数 --------------------------
        function renderItemGrid() {
            const grid = document.getElementById('itemGrid');
            grid.innerHTML = '';
            const filteredItems = currentCategory === "all" ? ITEMS : ITEMS.filter(i => i.category === currentCategory);
            
            filteredItems.forEach(item => {
                const slot = document.createElement('div');
                slot.className = 'item-slot';
                slot.style.backgroundColor = `#${item.color.toString(16).padStart(6, '0')}`;
                slot.innerHTML = `${item.name.slice(0,4)}<div class="count">${inventory[item.id]}</div>`;
                slot.addEventListener('click', () => { selectedSlot = ITEMS.findIndex(i => i.id === item.id); updateInventoryUI(); });
                grid.appendChild(slot);
            });
        }

        function renderRecipeList() {
            const list = document.getElementById('recipeList');
            list.innerHTML = '';
            
            RECIPES.forEach(recipe => {
                const resultItem = ITEMS.find(i => i.id === recipe.result);
                const canCraft = recipe.ingredients.every(ing => (inventory[ing] || 0) >= recipe.ingredients.filter(i => i === ing).length);
                const el = document.createElement('div');
                el.className = `recipe-item ${canCraft ? 'can-craft' : 'cannot-craft'}`;
                el.innerHTML = `<strong>[合成] ${resultItem.name} x${recipe.amount}</strong><br>需要: ${recipe.ingredients.map(id => ITEMS.find(i => i.id === id).name).join(' + ')}`;
                el.addEventListener('click', () => {
                    if(canCraft) {
                        recipe.ingredients.forEach(ing => inventory[ing]--);
                        inventory[recipe.result] += recipe.amount;
                        addChat(`合成成功: ${resultItem.name} x${recipe.amount}`);
                        renderItemGrid(); renderRecipeList(); updateInventoryUI();
                    }
                });
                list.appendChild(el);
            });

            SMELTING_RECIPES.forEach(recipe => {
                const inputItem = ITEMS.find(i => i.id === recipe.input);
                const outputItem = ITEMS.find(i => i.id === recipe.output);
                const canSmelt = inventory[recipe.input] >= 1;
                const el = document.createElement('div');
                el.className = `recipe-item ${canSmelt ? 'can-craft' : 'cannot-craft'}`;
                el.innerHTML = `<strong>[烧炼] ${outputItem.name}</strong><br>原料: ${inputItem.name} → ${outputItem.name}`;
                el.addEventListener('click', () => {
                    if(canSmelt && !furnace.inputItem) {
                        inventory[recipe.input]--;
                        furnace.inputItem = recipe.input;
                        document.getElementById('furnaceInputSlot').style.backgroundColor = `#${inputItem.color.toString(16).padStart(6, '0')}`;
                        document.getElementById('furnaceInputSlot').textContent = inputItem.name.slice(0,4);
                        addChat(`放入原料: ${inputItem.name}`);
                        renderItemGrid(); renderRecipeList();
                    }
                });
                list.appendChild(el);
            });
        }

        // -------------------------- 合成系统 --------------------------
        function setupCrafting() {
            document.querySelectorAll('.crafting-slot').forEach((slot, idx) => {
                slot.addEventListener('click', () => {
                    const selectedItem = ITEMS[selectedSlot];
                    if(inventory[selectedItem.id] > 0) {
                        inventory[selectedItem.id]--;
                        craftingGrid[idx] = selectedItem.id;
                        slot.style.backgroundColor = `#${selectedItem.color.toString(16).padStart(6, '0')}`;
                        slot.textContent = selectedItem.name.slice(0,4);
                        updateCraftResult(); updateInventoryUI();
                    }
                });
            });

            document.getElementById('craftingResult').addEventListener('click', () => {
                const validRecipe = RECIPES.find(r => {
                    const used = craftingGrid.filter(i => i !== null).sort();
                    const recipeIng = [...r.ingredients].sort();
                    return used.length === recipeIng.length && used.every((v,i) => v === recipeIng[i]);
                });
                if(validRecipe) {
                    inventory[validRecipe.result] += validRecipe.amount;
                    craftingGrid.forEach((id, i) => { if(id) { craftingGrid[i] = null; document.querySelectorAll('.crafting-slot')[i].textContent = ''; }});
                    addChat(`合成成功: ${ITEMS.find(i=>i.id===validRecipe.result).name} x${validRecipe.amount}`);
                    renderItemGrid(); renderRecipeList(); updateInventoryUI();
                }
            });
        }

        function updateCraftResult() {
            const result = RECIPES.find(r => {
                const used = craftingGrid.filter(i => i !== null).sort();
                const recipeIng = [...r.ingredients].sort();
                return used.length === recipeIng.length && used.every((v,i) => v === recipeIng[i]);
            });
            if(result) {
                const resItem = ITEMS.find(i=>i.id===result.result);
                document.getElementById('craftingResult').style.backgroundColor = `#${resItem.color.toString(16).padStart(6, '0')}80`;
                document.getElementById('craftingResult').innerHTML = `${resItem.name}<br>x${result.amount}`;
            }
        }

        // -------------------------- 熔炉系统 --------------------------
        function setupFurnace() {
            // 燃料槽点击
            document.getElementById('furnaceFuelSlot').addEventListener('click', () => {
                const selectedItem = ITEMS[selectedSlot];
                if(selectedItem.burnTime && inventory[selectedItem.id] > 0 && !furnace.fuelItem) {
                    inventory[selectedItem.id]--;
                    furnace.fuelItem = selectedItem.id;
                    furnace.maxBurnTime = selectedItem.burnTime;
                    furnace.burnTimeLeft = selectedItem.burnTime;
                    document.getElementById('furnaceFuelSlot').style.backgroundColor = `#${selectedItem.color.toString(16).padStart(6, '0')}`;
                    document.getElementById('furnaceFuelSlot').textContent = selectedItem.name.slice(0,4);
                    addChat(`放入燃料: ${selectedItem.name}，可烧${selectedItem.burnTime}秒`);
                    renderItemGrid(); renderRecipeList();
                }
            });

            // 成品槽点击
            document.getElementById('furnaceOutputSlot').addEventListener('click', () => {
                if(furnace.outputItem) {
                    inventory[furnace.outputItem]++;
                    const outItem = ITEMS.find(i=>i.id===furnace.outputItem);
                    addChat(`取出成品: ${outItem.name}`);
                    furnace.outputItem = null;
                    document.getElementById('furnaceOutputSlot').innerHTML = '成品';
                    renderItemGrid(); renderRecipeList();
                }
            });

            // 熔炉烧炼循环
            setInterval(() => {
                if(furnace.burnTimeLeft > 0) {
                    furnace.burnTimeLeft--;
                    document.getElementById('burnTime').textContent = furnace.burnTimeLeft;
                    
                    if(furnace.burnTimeLeft <= 0) {
                        document.getElementById('furnaceFuelSlot').textContent = '放燃料';
                        furnace.fuelItem = null;
                        addChat("燃料耗尽，更换新燃料");
                    }

                    if(furnace.inputItem && !furnace.outputItem) {
                        furnace.smeltProgress++;
                        const percent = Math.min(100, Math.floor(furnace.smeltProgress / furnace.maxSmeltTime * 100));
                        document.getElementById('burnProgress').style.width = `${percent}%`;
                        document.getElementById('smeltProgressLabel').textContent = `${percent}%`;

                        if(furnace.smeltProgress >= furnace.maxSmeltTime) {
                            const match = SMELTING_RECIPES.find(r => r.input === furnace.inputItem);
                            if(match) furnace.outputItem = match.output;
                            document.getElementById('furnaceOutputSlot').style.backgroundColor = `#${ITEMS.find(i=>i.id===furnace.outputItem).color.toString(16).padStart(6, '0')}80`;
                            document.getElementById('furnaceOutputSlot').textContent = ITEMS.find(i=>i.id===furnace.outputItem).name.slice(0,4);
                            
                            furnace.inputItem = null; furnace.smeltProgress = 0;
                            document.getElementById('furnaceInputSlot').innerHTML = '原料';
                            document.getElementById('burnProgress').style.width = '0%';
                            addChat("烧炼完成！");
                        }
                    }
                }
            }, 1000);
        }

        // -------------------------- UI辅助函数 --------------------------
        function updateInventoryUI() {
            const slots = document.querySelectorAll('#ui .inventory-slot');
            slots.forEach((slot, idx) => {
                const item = ITEMS[idx];
                slot.innerHTML = `${item.name}<div class="count">${inventory[item.id]}</div>`;
                slot.classList.toggle('selected', idx === selectedSlot);
            });
        }

        function addChat(msg) {
            const box = document.getElementById('chatBox');
            box.style.display = 'block';
            box.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            setTimeout(() => box.style.display = 'none', 5000);
        }

        // -------------------------- 事件绑定 --------------------------
        document.querySelectorAll('.category-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                currentCategory = tab.dataset.category;
                document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderItemGrid();
            });
        });

        document.getElementById('closeInventory').addEventListener('click', () => {
            document.getElementById('fullInventory').style.display = 'none';
        });

        document.getElementById('restartGame').addEventListener('click', () => location.reload());

        // 键盘控制
        window.addEventListener('keydown', e => {
            if(e.code >= 'Digit1' && e.code <= 'Digit9') {
                selectedSlot = parseInt(e.code.slice(-1)) - 1;
                updateInventoryUI();
            }
            if(e.code === 'KeyE') {
                const inv = document.getElementById('fullInventory');
                inv.style.display = inv.style.display === 'block' ? 'none' : 'block';
                if(inv.style.display === 'block') { renderItemGrid(); renderRecipeList(); }
            }
        });

        // -------------------------- 初始化 --------------------------
        function init() {
            renderItemGrid();
            renderRecipeList();
            setupCrafting();
            setupFurnace();
            updateInventoryUI();
            addChat("游戏已加载，点击物品放入合成台/熔炉开始游戏！");
        }

        // 启动游戏
        window.onload = init;
    </script>
</body>
</html>
